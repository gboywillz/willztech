<script>
  function safe(text){
  return String(text)
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}
let customers = [];
let inventory = [];
let sales = [];
  
/* SAVE DATA */  
function saveData(){  
  
localStorage.setItem(  
"customers",  
JSON.stringify(customers)  
);  
  
localStorage.setItem(  
"inventory",  
JSON.stringify(inventory)  
);  
  
localStorage.setItem(  
"sales",  
JSON.stringify(sales)  
);  
  
/* START APP */
updateDashboard();
loadCustomers();
loadInventory();
loadSales();
}  
  
/* ADD CUSTOMER */
async function saveCustomer(){

  let name =
  document.getElementById("name").value.trim();

  let phone =
  document.getElementById("phone").value.trim();

  if(!name || !phone){
    alert("Fill all fields");
    return;
  }

  try{

    alert("Saving...");

    const docRef = await window.addDoc(
      window.collection(window.db,"customers"),
      {
        name:name,
        phone:phone,
        repairs:[]
      }
    );

    alert("SUCCESS\nID: " + docRef.id);

  }catch(error){

    alert(
      "ERROR\n\n" +
      error.code +
      "\n\n" +
      error.message
    );

    console.error(error);
  }

}

  function showSuggestions(value){

let box = document.getElementById("suggestions");

if(!value){
  box.innerHTML = "";
  return;
}

let filtered = inventory.filter(i =>
  i.product.toLowerCase().includes(value.toLowerCase().trim())
);

let html = "";

filtered.forEach(i => {
html += `
<div class="suggest-item"
onclick='selectProduct(${JSON.stringify(i.product)})'>
${safe(i.product)}
</div>
`;
});

box.innerHTML = html;

}function selectProduct(name){

document.getElementById("saleProduct").value = name;

document.getElementById("suggestions").innerHTML = "";

}
/* ADD REPAIR */  
  
function addRepair(){  
  
let phone =  
document.getElementById("repairPhone").value.trim();  
  
let device =  
document.getElementById("device").value.trim();  
  
let fault =  
document.getElementById("fault").value.trim();  
  
let deposit =
Number(
document.getElementById("deposit").value.trim()
|| 0
);

let balance =
Number(
document.getElementById("balance").value.trim()
|| 0
);

  
if(!phone || !device || !fault){  
alert("Fill all repair fields");  
return;  
}  
  if(
isNaN(deposit) ||
isNaN(balance)
){
alert("Deposit and Balance must be numbers");
return;
}

if(
deposit < 0 ||
balance < 0
){
alert("Amounts cannot be negative");
return;
}
let customer =  
customers.find(  
c => c.phone === phone  
);  
  
if(!customer){  
alert("Customer not found");  
return;  
}  
  
customer.repairs.push({  
ticket:"WT-" + Date.now(),  
device:device,  
fault:fault,  
deposit:deposit || 0,  
balance:balance || 0,  
status:"Received",  
date:new Date().toLocaleDateString()  
});  
  
document.getElementById("repairPhone").value="";  
document.getElementById("device").value="";  
document.getElementById("fault").value="";  
document.getElementById("deposit").value="";  
document.getElementById("balance").value="";  
  
saveData();  
  
alert("Repair Added");  
}  
  
/* SEARCH + CUSTOMER LIST */  
  
function loadCustomers(){

let searchBox =
document.getElementById("search");

let search = "";

if(searchBox){
search = searchBox.value.toLowerCase();
}

let html="";

customers
.filter(c =>
c.name.toLowerCase().includes(search)
||
c.phone.includes(search)
)
.forEach(c => {
  
html += `  
<div class="card"  
onclick="viewCustomer('${c.phone}')">  
  
<b>${safe(c.name)}</b><br>
${safe(c.phone)}<br>
  
Repairs:  
${c.repairs.length}  
  
</div>  
`;  
  
});  
  
document.getElementById("customers")  
.innerHTML = html;  
  
}  
  
/* VIEW CUSTOMER */  
  
function viewCustomer(phone){  
  
let customer =  
customers.find(  
c => c.phone === phone  
);  
  
if(!customer) return;  
  
let repairsHtml =  
customer.repairs.length  
?  
  
customer.repairs.map(r => `  
  
<li>  
  
<b>${r.ticket}</b><br>  
  
${safe(r.device)}<br>

Fault:
${safe(r.fault)}<br>
  
Status:
<span class="status-${r.status.replace(/\s/g,'')}">
${r.status}
</span><br>
  
Deposit:  
₦${r.deposit}<br>  
  
Balance:  
₦${r.balance}<br>  
  
${r.date}  
<br><br>  
  
<button onclick="  
printReceipt(  
'${customer.phone}',  
'${r.ticket}'  
)  
">  
Receipt  
</button>  
  
<br><br>  
  
<select onchange="
updateStatus(
'${customer.phone}',
'${r.ticket}',
this.value
)">
<option value="Received" ${r.status==="Received"?"selected":""}>Received</option>

<option value="In Progress" ${r.status==="In Progress"?"selected":""}>In Progress</option>

<option value="Completed" ${r.status==="Completed"?"selected":""}>Completed</option>

<option value="Collected" ${r.status==="Collected"?"selected":""}>Collected</option>
</select>
<br><br>  
  
<button onclick="  
deleteRepair(  
'${customer.phone}',  
'${r.ticket}'  
)  
">  
Delete Repair  
</button>  
</li>  
  
`).join("")  
  
:  
  
"<li>No Repairs Yet</li>";  
  
document.getElementById("profile")  
.innerHTML = `  
  
<div class="card">  
  
<h2>${safe(customer.name)}</h2>

<button onclick="deleteCustomer('${customer.phone}')">  
Delete Customer  
</button>  

<p>${safe(customer.phone)}</p>
  
<h3>Repair History</h3>  
  
<ul>  
  
${repairsHtml}  
  
</ul>  
  
</div>  
  
`;  
  
}  
  
/* UPDATE STATUS */  
  
function updateStatus(
phone,
ticket,
newStatus
){

let customer =
customers.find(
c => c.phone === phone
);

if(!customer) return;

let repair =
customer.repairs.find(
r => r.ticket === ticket
);

if(!repair) return;

repair.status = newStatus;

saveData();

viewCustomer(phone);

}
function deleteCustomer(phone){  
  
let confirmDelete =  
confirm("Delete this customer?");  
  
if(!confirmDelete) return;  
  
customers =  
customers.filter(  
c => c.phone !== phone  
);  
  
saveData();  
  
document.getElementById(  
"profile"  
).innerHTML = "";  
  
alert("Customer Deleted");  
  
}  
function deleteRepair(  
phone,  
ticket  
){  
  
let customer =  
customers.find(  
c => c.phone === phone  
);  
  
if(!customer) return;  
  
customer.repairs =  
customer.repairs.filter(  
r => r.ticket !== ticket  
);  
  
saveData();  
  
viewCustomer(phone);  
  
alert("Repair Deleted");  
  
}  
function printReceipt(  
phone,  
ticket  
){  
  
let customer =  
customers.find(  
c => c.phone === phone  
);  
  
if(!customer) return;  
  
let repair =  
customer.repairs.find(  
r => r.ticket === ticket  
);  
  
if(!repair) return;  
  let total =
Number(repair.deposit || 0) +
Number(repair.balance || 0);

  let receipt = `
📱 WILLZTECH REPAIR RECEIPT

Customer: ${customer.name.trim()}
Phone: ${customer.phone.trim()}

Ticket: ${repair.ticket}

Device: ${repair.device.trim()}
Fault: ${repair.fault.trim()}

Total Cost: ₦${total}

Deposit: ₦${repair.deposit}
Balance: ₦${repair.balance}

Status: ${repair.status}
Date: ${repair.date}

Thank you for choosing WillzTech.
`;
let action =  
prompt(  
"Type:\n1 = Copy\n2 = WhatsApp"  
);  
  
if(action === "1"){  
  
navigator.clipboard  
.writeText(receipt);  
  
alert("Receipt Copied");  
  
}  
  
if(action === "2"){  
  
window.open(  
"https://wa.me/?text=" +  
encodeURIComponent(receipt)  
);  
  
}  
  
}  
/* DASHBOARD */  
function addInventory(){  
  
let product =  
document.getElementById("productName").value;  
  
let category =  
document.getElementById("category").value;  
  
let costPrice =  
document.getElementById("costPrice").value;  
  
let sellingPrice =  
document.getElementById("sellingPrice").value;  
  
let quantity =  
document.getElementById("quantity").value;  
  
let supplier =  
document.getElementById("supplier").value;  
  
if(!product || !quantity){
  alert("Fill product details");
  return;
}

let existingProduct =
inventory.find(
i => i.product.toLowerCase() === product.toLowerCase()
);

if(existingProduct){
  alert("Product already exists");
  return;
}
  
inventory.push({  
product,  
category,  
costPrice,  
sellingPrice,  
quantity: Number(quantity),
supplier  
});  
  document.getElementById("productName").value = "";
document.getElementById("category").value = "";
document.getElementById("costPrice").value = "";
document.getElementById("sellingPrice").value = "";
document.getElementById("quantity").value = "";
document.getElementById("supplier").value = "";
saveData();  
  
alert("Product Added");  
}  
  
function loadInventory(){  
  
let html = "";  
  
inventory.forEach(item => {  
  
html += `  
<div class="card">  
  
<b>${safe(item.product)}</b><br>

Category: ${safe(item.category)}</br>
  
Stock: ${item.quantity}<br>  
  
Selling Price: ₦${item.sellingPrice}  
  
</div>  
`;  
  
});  
  
document.getElementById(  
"inventoryList"  
).innerHTML = html;  
  
}  
function recordSale(){  
  
let product =  
document.getElementById("saleProduct").value;  
  
let qty =  
Number(  
document.getElementById("saleQty").value  
);  
  
let item = inventory.find(
i => i.product.toLowerCase().includes(product.toLowerCase().trim())
);
  
if(!item){  
alert("Product not found");  
return;  
}  
  
if(qty > Number(item.quantity)){  
alert("Not enough stock");  
return;  
}  
  
  if(qty <= 0){
  alert("Invalid quantity");
  return;
}
item.quantity =  
Number(item.quantity) - qty;  

if(item.quantity <= 5){
  alert("Warning: Low stock on " + item.product);
}
  
let cp = Number(item.costPrice || 0);
let sp = Number(item.sellingPrice || 0);

let amount = qty * sp;
let profit = qty * (sp - cp);
  
sales.push({  
product,  
qty,  
amount,  
profit,  
date:new Date().toLocaleDateString()  
});  
  document.getElementById("saleProduct").value = "";
document.getElementById("saleQty").value = "";
saveData();  
  
alert("Sale Recorded");  
}  
  
function loadSales(){  
  
let html = "";  
  
sales.forEach(s => {  
  
html += `  
<div class="card">  
  
<b>${s.product}</b><br>  
  
Quantity: ${s.qty}<br>  
  
Amount: ₦${s.amount}<br>  
  
Profit: ₦${s.profit}  
  
</div>  
`;  
  
});  
  
document.getElementById(  
"salesList"  
).innerHTML = html;  
  
}  
function updateDashboard(){

let totalCustomers = customers.length;

let totalRepairs = 0;
let pending = 0;
let received = 0;
let inProgress = 0;
let completed = 0;
let balance = 0;

let totalSales = 0;
let totalProfit = 0;

/* SALES */
sales.forEach(s => {
  totalSales += Number(s.amount || 0);
  totalProfit += Number(s.profit || 0);
});

/* REPAIRS */
customers.forEach(c => {
  (c.repairs || []).forEach(r => {

    totalRepairs++;

    if (r.status === "Received") {
      received++;
      pending++;
    }

    else if (r.status === "In Progress") {
      inProgress++;
      pending++;
    }

    else if (r.status === "Completed") {
      completed++;
    }

    else if (r.status === "Collected") {
      completed++;
    }

    if (r.status !== "Collected") {
      balance += Number(r.balance || 0);
    }

  });
});

/* UI UPDATE */
document.getElementById("totalCustomers").innerText = totalCustomers;
document.getElementById("totalRepairs").innerText = totalRepairs;

document.getElementById("pendingRepairs").innerText = pending;
document.getElementById("receivedRepairs").innerText = received;
document.getElementById("completedRepairs").innerText = completed;

document.getElementById("outstandingBalance").innerText =
"₦" + balance.toLocaleString();

document.getElementById("totalSales").innerText =
"₦" + totalSales.toLocaleString();

document.getElementById("totalProfit").innerText =
"₦" + totalProfit.toLocaleString();

}
  
/* SHOW / HIDE CUSTOMERS */

let div =  
document.getElementById("customers");  
  
if(div.style.display === "none"){  
div.style.display = "block";  
}else{  
div.style.display = "none";

function backToRepair(){

}
function showPendingRepairs(){

document.getElementById("homePage").style.display = "none";

document.getElementById("pendingPage").style.display = "block";

let html = "";

customers.forEach(c => {

(c.repairs || []).forEach(r => {

if(
r.status !== "Completed" &&
r.status !== "Collected"
){

html += `
<div class="card">

<b>${safe(c.name)}</b><br>

${safe(c.phone)}<br>

Ticket: ${r.ticket}<br>

Device: ${safe(r.device)}<br>

Status: ${r.status}

</div>
`;

}

});

});

document.getElementById("pendingList").innerHTML =
html || "<div class='card'>No Pending Repairs</div>";

}

window.loginUser = async function(){

  const email =
  document.getElementById("loginEmail").value;

  const password =
  document.getElementById("loginPassword").value;

  try{

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

  }catch(error){

    alert(error.message);

  }

};

onAuthStateChanged(auth, user => {

  if(user){
    loadCustomersFromFirebase();
document.getElementById("topBar").style.display = "block";
    document.getElementById("loginPage")
    .style.display = "none";

    document.getElementById("homePage")
    .style.display = "block";

    if(
      user.email ===
      "gboywillz@gmail.com"
    ){

      window.userRole = "admin";

    }else{

      window.userRole = "worker";

    }

}else{

    document.getElementById("topBar").style.display = "none";

    document.getElementById("loginPage").style.display = "block";

    document.getElementById("homePage").style.display = "none";

    document.getElementById("repairSection").style.display = "none";

    document.getElementById("salesSection").style.display = "none";

    document.getElementById("customersPage").style.display = "none";

    document.getElementById("pendingPage").style.display = "none";

    document.getElementById("profile").innerHTML = "";
document.getElementById("loginEmail").value = "";
document.getElementById("loginPassword").value = "";
}

});

window.logoutUser = function(){

  goHome();

  document.getElementById("repairSection").style.display = "none";
  document.getElementById("salesSection").style.display = "none";
  document.getElementById("customersPage").style.display = "none";
  document.getElementById("pendingPage").style.display = "none";

  signOut(auth);

};

</script>
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js").then(reg => {

    // Force update check
    reg.update();

    reg.addEventListener("updatefound", () => {
      const newWorker = reg.installing;

      newWorker.addEventListener("statechange", () => {
        if (
          newWorker.state === "installed" &&
          navigator.serviceWorker.controller
        ) {
          window.location.reload();
        }
      });
    });

  });
}
</script>
<script>
window.addEventListener("load", () => {
  setTimeout(() => {
    document.getElementById("splash").style.display = "none";
  }, 2500);
});
</script>
